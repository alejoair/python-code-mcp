[project]
name = "python-code-mcp"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.2.4",
    "httpx>=0.27",
    "tree-sitter-language-pack==1.8.0",
    "tree-sitter>=0.24,<1",
    "tree-sitter-python>=0.24,<1",
    # grep-ast brings tree-sitter-language-pack as a transitive dep — same package already
    # pinned at 1.8.0, so no conflict. PyTreeContext subclass bypasses grep-ast's native
    # parser (incompatible with tsl-pack >= 1.8 builtins.Parser) by using our own.
    "grep-ast==0.9.0",
    "ty==0.0.33",
]

[project.scripts]
python-code-mcp = "ty_lsp.server:main"

[tool.ty.environment]
extra-paths = ["C:\\Users\\user\\AppData\\Roaming\\Python\\Python314\\site-packages"]

[tool.hatch.build.targets.wheel]
packages = ["src/ty_lsp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
